definitions:
  httputils.ErrorDetail:
    properties:
      field:
        type: string
      issue:
        type: string
    type: object
  httputils.ErrorResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/httputils.ErrorDetail'
        type: array
      message:
        type: string
    type: object
  pageable.Page:
    properties:
      number:
        description: Current page number
        type: integer
      size:
        description: Current page size
        type: integer
      totalElements:
        description: Total elements in all pages
        type: integer
      totalPages:
        description: Total pages count
        type: integer
    type: object
  v1.buyCreateRequest:
    properties:
      client_id:
        description: Foreign key referencing the client who made the purchase.
        type: integer
      description:
        description: Optional description or additional details of the purchase.
        type: string
    type: object
  v1.buyItemCreateRequest:
    properties:
      buy_id:
        description: Foreign key referencing the associated purchase.
        type: integer
      price:
        description: Price per unit of the product at the time of purchase.
        type: string
      product_id:
        description: Foreign key referencing the purchased product.
        type: integer
      quantity:
        description: Number of units of the product in the purchase.
        type: integer
    type: object
  v1.buyItemResponse:
    properties:
      buy_id:
        description: Foreign key referencing the associated purchase.
        type: integer
      created_at:
        description: Internal field, creation TS
        type: string
      guid:
        description: Internal field, UUID of the row
        type: string
      price:
        description: Price per unit of the product at the time of purchase.
        type: string
      product_id:
        description: Foreign key referencing the purchased product.
        type: integer
      quantity:
        description: Number of units of the product in the purchase.
        type: integer
      record_id:
        description: Primary key for the buy_item table.
        type: integer
      updated_at:
        description: Internal field, last updated TS
        type: string
    type: object
  v1.buyItemResponseList:
    properties:
      data:
        description: Payload
        items:
          $ref: '#/definitions/v1.buyItemResponse'
        type: array
      page:
        allOf:
        - $ref: '#/definitions/pageable.Page'
        description: Page information (if present)
    type: object
  v1.buyItemUpdateRequest:
    properties:
      buy_id:
        description: Foreign key referencing the associated purchase.
        type: integer
      price:
        description: Price per unit of the product at the time of purchase.
        type: string
