          schema:
            $ref: '#/definitions/httputils.ErrorResponse'
        "500":
          description: Internal Server Error (Deletion failed)
          schema:
            $ref: '#/definitions/httputils.ErrorResponse'
      summary: Delete a BuyItem
      tags:
      - BuyItem
    get:
      consumes:
      - application/json
      description: Retrieves a list of all BuyItem without pagination.
      produces:
      - application/json
      responses:
