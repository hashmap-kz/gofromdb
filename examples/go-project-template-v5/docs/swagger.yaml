    delete:
      consumes:
      - application/json
      description: Deletes a BuyItem by its ID
      parameters:
      - description: BuyItem ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content (Successfully deleted)
        "400":
